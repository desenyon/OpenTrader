name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests, build, and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Test economic and application behavior
        run: npm test
      - name: Build web, server, and admin CLI
        run: npm run build
      - name: Smoke-test the production bundle
        run: npm run test:production
