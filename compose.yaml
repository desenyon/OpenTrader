services:
  opentrader:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - opentrader-data:/app/data
    environment:
      NODE_ENV: production
      LIVE_DATA_ENABLED: "${LIVE_DATA_ENABLED:-false}"
      DATA_USE_ACKNOWLEDGED: "${DATA_USE_ACKNOWLEDGED:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:3000}"
    restart: unless-stopped
volumes:
  opentrader-data:
